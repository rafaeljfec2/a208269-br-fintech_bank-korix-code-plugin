name: Context Compiler Native Artifacts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/context-compiler-native.yml"
      - "packages/context-compiler/**"
      - "scripts/validate-native-manifest.mjs"
      - "src/context/__tests__/contextCompilerNativeWorkflow.test.ts"
      - "package.json"
      - "pnpm-workspace.yaml"
  push:
    tags:
      - "v*"

jobs:
  build-native:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: darwin-arm64
            os: macos-14
            target: aarch64-apple-darwin
          - artifact: darwin-x64
            os: macos-13
            target: x86_64-apple-darwin
          - artifact: linux-arm64-gnu
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: --use-napi-cross
          - artifact: linux-arm64-musl
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cross: --cross-compile
          - artifact: linux-x64-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: --use-napi-cross
          - artifact: linux-x64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: --cross-compile
          - artifact: win32-arm64-msvc
            os: windows-latest
            target: aarch64-pc-windows-msvc
          - artifact: win32-x64-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build native artifact
        shell: bash
        run: |
          pnpm --filter @korix/context-compiler exec napi build \
            --manifest-path native/Cargo.toml \
            --platform \
            --release \
            --target ${{ matrix.target }} \
            ${{ matrix.cross }}

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: context-compiler-${{ matrix.artifact }}
          path: packages/context-compiler/native/index.${{ matrix.artifact }}.node
          if-no-files-found: error

  darwin-universal:
    name: Build darwin-universal
    runs-on: macos-14
    needs: build-native
    env:
      artifact: darwin-universal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Download Darwin arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: context-compiler-darwin-arm64
          path: packages/context-compiler/native

      - name: Download Darwin x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: context-compiler-darwin-x64
          path: packages/context-compiler/native

      - name: Assemble universal artifact
        run: |
          pnpm --filter @korix/context-compiler exec napi universalize \
            --cwd packages/context-compiler/native \
            --output-dir .
          test -f packages/context-compiler/native/index.darwin-universal.node

      - name: Upload universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: context-compiler-darwin-universal
          path: packages/context-compiler/native/index.darwin-universal.node
          if-no-files-found: error

  package-vsix:
    name: Package VSIX with native artifacts
    runs-on: ubuntu-latest
    needs:
      - build-native
      - darwin-universal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: context-compiler-*
          path: packages/context-compiler/native
          merge-multiple: true

      - name: Compile extension with native artifacts
        run: pnpm run compile

      - name: Verify native packaging manifest
        run: |
          test -f dist/native/context-compiler-native-manifest.json
          node scripts/validate-native-manifest.mjs dist/native/context-compiler-native-manifest.json

      - name: Package VSIX
        run: pnpm exec vsce package --no-dependencies

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: korix-code-vsix
          path: "*.vsix"
          if-no-files-found: error
